<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHESZ STORE — Feedbacks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../DESIGNEDCSS/style.css">
<link rel="stylesheet" href="../DESIGNEDCSS/admin.css">
<script src="../SCRIPTJS/script.js" defer></script>
</head>
<body>
<main class="wrap fb-wrap">
  <h2 class="page-h"><i class="fas fa-star"></i> FEEDBACKS</h2>
  <p class="page-sub">SEE WHAT OTHER USERS SAY ABOUT ARCHESZ</p>

  <section class="fb-summary reveal">
    <div class="fb-score"><b id="fbAvgNum">0.0</b><div class="fb-starsbig" id="fbAvgStars">☆☆☆☆☆</div><small id="fbCount"></small></div>
    <div class="fb-bars" id="fbBars"></div>
  </section>

  <section class="fb-write reveal">
    <div class="fb-wh"><div class="fb-av" id="fbAv">GU</div><div><small>WRITE A REVIEW AS</small><b class="fb-mail" id="fbWho"></b></div></div>
    <div class="rate-row"><span class="rate-stars" id="rateStars"><i data-n="1">★</i><i data-n="2">★</i><i data-n="3">★</i><i data-n="4">★</i><i data-n="5">★</i></span><em id="rateLbl">AMAZING!</em></div>
    <div class="fb-ta"><textarea id="fbText" maxlength="400" placeholder="Say your feedback…"></textarea><small id="fbCnt">0/400</small></div>
    <div class="attach-chip" id="fbChip" hidden></div>
    <div class="fb-actions">
      <button type="button" class="icon-btn" id="fbAttach" title="Add image"><i class="fas fa-image"></i></button>
      <button type="button" class="btn btn-purple" id="fbSend"><i class="fas fa-paper-plane"></i> SEND FEEDBACK</button>
    </div>
  </section>

  <h3 class="fb-h"><i class="step-dot"></i> RECENT REVIEWS</h3>
  <div id="fbList"></div>
</main>
</body>
</html>
