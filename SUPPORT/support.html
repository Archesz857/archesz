<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHESZ STORE — Support Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../DESIGNEDCSS/style.css">
<script src="../SCRIPTJS/script.js" defer></script>
</head>
<body>
<main class="wrap sup-wrap">
  <h2 class="page-h"><i class="fas fa-headset"></i> SUPPORT CENTER</h2>
  <p class="page-sub">CHAT WITH OUR TEAM ABOUT YOUR ORDER</p>
  <section class="chat-shell">
    <div class="chat-head"><img src="/ASSETS/homepage-icon.png" alt="" onerror="this.style.display='none'"><div><b>ARCHESZ ADMIN</b><small><i class="dot-s on"></i> ONLINE · REPLIES IN MINUTES</small></div></div>
    <p class="warn-note" id="regHint" hidden>You are not registered yet. <a href="../AUTH/login.html">Register</a> so admin can see your Gmail.</p>
    <div class="chat-meta"><small>CHATTING AS</small><b id="who" class="keep-case"></b></div>
    <label class="field-label" for="orderSel">ABOUT ORDER</label>
    <select id="orderSel" class="sel"></select>
    <div class="chat-box" id="chatBox"></div>
    <div class="attach-chip" id="attachChip" hidden></div>
    <div class="chat-input">
      <button type="button" class="icon-btn" id="attachBtn" title="Send image"><i class="fas fa-image"></i></button>
      <div class="field-box"><input id="msgIn" type="text" placeholder="Type your message…" autocomplete="off"></div>
      <button type="button" class="btn btn-purple send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
    </div>
  </section>
</main>
</body>
</html>
