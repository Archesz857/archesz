<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHESZ STORE — My Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../DESIGNEDCSS/style.css">
<script src="../SCRIPTJS/script.js" defer></script>
</head>
<body>
<div class="container">
  <header class="shop-header">
    <a href="../HOMEPAGE/index.html" class="back-btn"><i class="fas fa-times"></i></a>
    <h1>My Wallet</h1>
    <p>Your wallet balance and top-up history</p>
  </header>
  <div class="hero-card bal-card">
    <p class="bal-label">Wallet Balance</p>
    <div class="bal-num"><small>₱</small><span id="bal">0</span></div>
    <div class="hero-btns"><a href="../BUYPOINTS/buypoints.html" class="btn btn-purple"><i class="fas fa-plus"></i> Add Funds</a><a href="../DONEBUY/donebuy.html" class="btn btn-dark">TRANSACTIONS</a></div>
  </div>
  <div class="filter-btns" id="histTabs"><button class="filter-btn active" data-f="all">All</button><button class="filter-btn" data-f="pending">Pending</button><button class="filter-btn" data-f="approved">Approved</button></div>
  <div class="hist-list" id="histList"></div>
  <button class="link-btn" id="resetDemo"><i class="fas fa-rotate-left"></i> Reset demo data</button>
</div>
</body>
</html>
