<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHESZ STORE — My Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../DESIGNEDCSS/style.css">
<script src="../SCRIPTJS/script.js" defer></script>
</head>
<body>
<main class="wrap">
  <h2 class="page-h"><i class="fas fa-wallet"></i> MY WALLET</h2>
  <p class="page-sub">YOUR WALLET BALANCE AND TOP-UP HISTORY</p>
  <section class="wal-hero">
    <div class="w-ico"><i class="fas fa-wallet"></i></div>
    <small>WALLET BALANCE</small>
    <div class="wal-bal"><span>₱</span><b id="bal">0</b></div>
    <div class="wal-btns"><a href="../BUYPOINTS/buypoints.html" class="btn btn-purple"><i class="fas fa-circle-plus"></i> ADD FUNDS</a><a href="../DONEBUY/donebuy.html" class="btn btn-dark"><i class="fas fa-circle-check"></i> DONE BUY</a></div>
  </section>
  <div class="mini-stats three"><div class="warn"><i class="fas fa-clock"></i><b id="wPend">₱0</b><small>PENDING</small></div><div class="ok"><i class="fas fa-circle-check"></i><b id="wOk">₱0</b><small>APPROVED</small></div><div class="bad"><i class="fas fa-circle-xmark"></i><b id="wBad">0</b><small>CANCELLED</small></div></div>
  <div class="chip-row" id="histTabs">
    <button class="chip active" data-f="all">ALL <em id="c-all">0</em></button><button class="chip" data-f="pending">PENDING <em id="c-pending">0</em></button><button class="chip" data-f="approved">APPROVED <em id="c-approved">0</em></button><button class="chip" data-f="cancelled">CANCELLED <em id="c-cancelled">0</em></button>
  </div>
  <div id="histList"></div>
</main>
</body>
</html>
