<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHESZ STORE — Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../DESIGNEDCSS/style.css">
<script src="../SCRIPTJS/script.js" defer></script>
</head>
<body>
<div class="container auth-wrap">
  <div class="auth-head">
    <div class="vip-badge"><span class="dot"></span> ARCHESZ STORE</div>
    <h1>Register</h1>
    <p>Register Your Accounts to secure order</p>
  </div>
  <div class="panel-card">
    <button class="btn btn-dark full-btn" id="googleBtn" type="button"><i class="fab fa-google"></i> Continue with Google</button>
    <div class="or-line"><span>or</span></div>
    <form id="loginForm">
      <label class="field-label" for="email">Email address</label>
      <div class="field-box"><i class="fas fa-envelope"></i><input id="email" type="email" placeholder="RegisterGmail@gmail.com" required></div>
      <p class="warn-note"><i class="fas fa-triangle-exclamation"></i> Email login has a known bug. Use Google if it fails.</p>
      <button class="btn btn-purple full-btn" type="submit">Continue</button>
    </form>
  </div>
</div>
</body>
</html>
