<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHESZ STORE — Add Funds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../DESIGNEDCSS/style.css">
<script src="../SCRIPTJS/script.js" defer></script>
</head>
<body>
<div class="container">
  <header class="shop-header">
    <a href="../HOMEPAGE/index.html" class="back-btn"><i class="fas fa-times"></i></a>
    <h1>ADD FUNDS</h1>
    <p>ADD FUNDS TO YOUR WALLET TO PURCHASE LICENCE KEYS INSTANTLY.</p>
  </header>

  <div class="panel-card tu-card">
    <h2 class="tu-title"><i class="tu-dot"></i> AMOUNT TO DEPOSIT</h2>

    <div class="gcash-box">
      <img class="gcash-img" src="/ASSETS/gcash.png" alt="GCash QR" onerror="this.style.display='none'">
      <div class="gcash-line"><span>GCASH</span><b>09933554796</b></div>
    </div>

    <div class="input-points">
      <i class="fas fa-coins tu-coin"></i>
      <input type="text" id="tuAmt" value="50" readonly aria-label="Selected amount">
      <span>₱</span>
    </div>
    <div class="quick-btns tu-grid">
      <button class="tu-chip active" data-a="50">50</button>
      <button class="tu-chip" data-a="100">100</button>
      <button class="tu-chip" data-a="500"><em class="best-tag">BEST</em>500</button>
      <button class="tu-chip" data-a="1000">1000</button>
      <button class="tu-chip" data-a="5000">5000</button>
    </div>

    <h2 class="tu-title tu-sub"><i class="fas fa-upload"></i> UPLOAD PROOF (JPG OR PNG)</h2>
    <div class="upload-area">
      <i class="fas fa-image upload-icon"></i>
      <p>TAP TO UPLOAD YOUR GCASH PAYMENT PROOF</p>
      <small>JPG OR PNG ONLY · UP TO 5MB</small>
    </div>

    <button class="btn btn-purple full-btn" id="tuSubmit"><i class="fas fa-paper-plane"></i> SUBMIT</button>
  </div>
</div>
</body>
</html>
