<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b5cf6">
<title>ARCHESZ OFFICIAL — Browse Products</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../DESIGNEDCSS/style.css">
<script src="../SCRIPTJS/script.js" defer></script>
</head>
<body>
<main class="wrap">
  <section class="store-banner reveal"><video class="sb-video" src="/ASSETS/store.mp4" poster="/ASSETS/shop-bg.jpg" autoplay muted loop playsinline preload="metadata"></video><div class="sb-shade"></div><h1>STORE</h1><p>PREMIUM GAME ENHANCEMENT TOOLS &amp; ACCOUNTS</p></section>
  <h2 class="page-h"><i class="fas fa-store"></i> BROWSE PRODUCTS</h2>
  <p class="page-sub">SELECT YOUR GAME AND PLATFORM - INSTANT KEY DELIVERY AFTER PURCHASE</p>
  <div class="tabs2"><button class="tab2 active"><i class="fas fa-gamepad"></i> GAME KEYS &amp; SERVICES <em>1</em></button><button class="tab2" id="tabAcc"><i class="fas fa-id-card"></i> ACCOUNTS FOR SALE <em>0</em></button></div>
  <div class="filter-box">
    <label><i class="fas fa-gamepad"></i> GAME</label>
    <select id="fGame" class="sel"><option value="">ALL GAMES</option></select>
    <label><i class="fas fa-mobile-screen"></i> PLATFORM</label>
    <select id="fPlat" class="sel"><option value="">SELECT DEVICE</option><option>Android</option><option>iOS</option></select>
    <label><i class="fas fa-magnifying-glass"></i> SEARCH</label>
    <div class="search-box"><i class="fas fa-search"></i><input id="fSearch" type="text" placeholder="Search products…"></div>
    <button class="btn btn-cancel" id="fClear"><i class="fas fa-circle-xmark"></i> CLEAR ALL</button>
  </div>
  <div id="chips" class="chips"></div>
  <p id="showing" class="showing"></p>
  <div id="prodList"></div>
</main>
</body>
</html>
